<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recreated Image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <style>
      html,body{height:100%}
      body{margin:0;background:#fff;font-family: Georgia, 'Times New Roman', Times, serif;color:#000}
      .bar-link{background:#2f00ff;color:#fff;text-align:center;padding:18px 0;font-weight:700}
      .bar-header{background:#e86d56;color:#000;text-align:center;padding:18px 0;font-weight:700}
      .bar-footer{background:#9beaa0;color:#000;text-align:center;padding:18px 0;font-weight:700}
      .main-row{min-height:520px}
      .aside-left{background:#ffd800;color:#000;padding:40px 20px;font-weight:700}
      .aside-right{background:#f07fb9;color:#000;padding:40px 20px;font-weight:700}
      .main-content{background:#66ccff;color:#000;padding:60px 60px}
      .quote{font-family: Georgia, 'Times New Roman', Times, serif;font-size:28px;font-weight:700;line-height:1.2;max-width:820px}
      @media (max-width:767px){
        .main-row{min-height:300px}
        .aside-left,.aside-right{padding:20px;text-align:center}
        .main-content{padding:30px}
        .quote{font-size:20px}
      }
      /* mobile navbar (hidden on wide screens) */
      .mobile-nav{display:none}
      .page-links a{color:#fff;text-decoration:none;font-weight:700}
      @media (max-width:576px){.bar-link{padding:12px 0}.mobile-nav{display:block}}
    </style>
  </head>
  <body>

    <!-- top link bar: page nav + social icons on desktop, both collapse into mobile menu -->
    <div class="bar-link position-relative">
      <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="page-links d-none d-sm-flex gap-3">
          <a href="jaakd-ds-roshambo-intro.html">Roshambo Intro</a>
          <a href="jaakd-ds-roshambo-expert.html">Roshambo Expert</a>
          <a href="jaakd-ds-roshambo-cheat.html">Roshambo Cheat</a>
          <a href="jaakd-ds-roshambo-gun.html">Roshambo Gun</a>
          <a href="jaakd-ds-roshambo-gamble.html">Roshambo Gamble</a>
          <a href="flappy-bird.html">Flappy Bird</a>
          <a href="tic-tac-toe.html">Tic Tac Toe</a>
        </div>
        <div class="d-none d-sm-flex gap-3">
          <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube" class="text-white"><i class="lni lni-youtube fs-4"></i></a>
          <a href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" class="text-white"><i class="lni lni-linkedin fs-4"></i></a>
          <a href="https://www.reddit.com" target="_blank" rel="noopener" aria-label="Reddit" class="text-white"><i class="lni lni-reddit fs-4"></i></a>
        </div>
        <button class="btn btn-sm btn-light d-block d-sm-none mobile-nav ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu" aria-expanded="false" aria-controls="mobileMenu">
          <i class="lni lni-menu"></i>
        </button>
      </div>
    </div>

    <div class="collapse" id="mobileMenu">
      <div class="bg-white p-2 border-bottom">
        <div class="d-flex flex-column gap-1 mb-2">
          <a class="py-1 text-decoration-none text-dark" href="jaakd-ds-roshambo-intro.html">Roshambo Intro</a>
          <a class="py-1 text-decoration-none text-dark" href="jaakd-ds-roshambo-expert.html">Roshambo Expert</a>
          <a class="py-1 text-decoration-none text-dark" href="jaakd-ds-roshambo-cheat.html">Roshambo Cheat</a>
          <a class="py-1 text-decoration-none text-dark" href="jaakd-ds-roshambo-gun.html">Roshambo Gun</a>
          <a class="py-1 text-decoration-none text-dark" href="jaakd-ds-roshambo-gamble.html">Roshambo Gamble</a>
          <a class="py-1 text-decoration-none text-dark" href="flappy-bird.html">Flappy Bird</a>
          <a class="py-1 text-decoration-none text-dark" href="tic-tac-toe.html">Tic Tac Toe</a>
        </div>
        <div class="d-flex gap-3">
          <a class="py-2 text-decoration-none text-dark" href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube"><i class="lni lni-youtube fs-4"></i></a>
          <a class="py-2 text-decoration-none text-dark" href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="lni lni-linkedin fs-4"></i></a>
          <a class="py-2 text-decoration-none text-dark" href="https://www.reddit.com" target="_blank" rel="noopener" aria-label="Reddit"><i class="lni lni-reddit fs-4"></i></a>
        </div>
      </div>
    </div>

    <div class="bar-header">Header</div>

    <div class="container-fluid px-3 px-md-5">
      <div class="row main-row g-0">
        <div class="col-12 col-md-2 aside-left">Aside 1</div>
        <div class="col-12 col-md-8 main-content d-flex align-items-start justify-content-center">
          <div class="quote"> {{ content }} </div>
        </div>
        <div class="col-12 col-md-2 aside-right">Aside 2</div>
      </div>
    </div>

    <div class="bar-footer">Footer</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
