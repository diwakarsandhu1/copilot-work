<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <style>
      html,body{height:100%}
      body{margin:0;background:#fff;font-family: Georgia, 'Times New Roman', Times, serif;color:#000}
      .bar-link{background:#2f00ff;color:#fff;text-align:center;padding:18px 0;font-weight:700}
      .bar-header{background:#e86d56;color:#000;text-align:center;padding:18px 0;font-weight:700}
      .bar-footer{background:#9beaa0;color:#000;text-align:center;padding:18px 0;font-weight:700}
      /* mobile navbar (hidden on wide screens) */
      .mobile-nav{display:none}
      .page-links a{color:#fff;text-decoration:none;font-weight:700}
      @media (max-width:576px){.bar-link{padding:12px 0}.mobile-nav{display:block}}

      .main-row{min-height:520px}
      .aside-left{background:#ffd800;color:#000;padding:40px 20px;font-weight:700}
      .aside-right{background:#f07fb9;color:#000;padding:40px 20px;font-weight:700}
      @media (max-width:767px){
        .main-row{min-height:auto}
        .aside-left,.aside-right{padding:20px;text-align:center}
      }

      .game-wrap{padding:40px 20px;background:#66ccff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:520px}
      #ttt-status{font-size:22px;font-weight:700}
      .ttt-board{display:grid;grid-template-columns:repeat(3, minmax(70px, 110px));grid-template-rows:repeat(3, minmax(70px, 110px));gap:8px}
      .ttt-cell{background:#fff;border:3px solid #000;font-size:2.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
      .ttt-cell:hover{background:#eee}
      .ttt-cell.taken{cursor:default}
    </style>
  </head>
  <body>

    <!-- top link bar: page nav + social icons on desktop, both collapse into mobile menu -->
    <div class="bar-link position-relative">
      <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="page-links d-none d-sm-flex gap-3">
          <a href="index.html">Home</a>
          <a href="flappy_bird.html">Flappy Bird</a>
          <a href="tic_tac_toe.html">Tic Tac Toe</a>
        </div>
        <div class="d-none d-sm-flex gap-3">
          <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube" class="text-white"><i class="lni lni-youtube fs-4"></i></a>
          <a href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" class="text-white"><i class="lni lni-linkedin fs-4"></i></a>
          <a href="https://www.reddit.com" target="_blank" rel="noopener" aria-label="Reddit" class="text-white"><i class="lni lni-reddit fs-4"></i></a>
        </div>
        <button class="btn btn-sm btn-light d-block d-sm-none mobile-nav ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu" aria-expanded="false" aria-controls="mobileMenu">
          <i class="lni lni-menu"></i>
        </button>
      </div>
    </div>

    <div class="collapse" id="mobileMenu">
      <div class="bg-white p-2 border-bottom">
        <div class="d-flex flex-column gap-1 mb-2">
          <a class="py-1 text-decoration-none text-dark" href="index.html">Home</a>
          <a class="py-1 text-decoration-none text-dark" href="flappy_bird.html">Flappy Bird</a>
          <a class="py-1 text-decoration-none text-dark" href="tic_tac_toe.html">Tic Tac Toe</a>
        </div>
        <div class="d-flex gap-3">
          <a class="py-2 text-decoration-none text-dark" href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube"><i class="lni lni-youtube fs-4"></i></a>
          <a class="py-2 text-decoration-none text-dark" href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="lni lni-linkedin fs-4"></i></a>
          <a class="py-2 text-decoration-none text-dark" href="https://www.reddit.com" target="_blank" rel="noopener" aria-label="Reddit"><i class="lni lni-reddit fs-4"></i></a>
        </div>
      </div>
    </div>

    <div class="bar-header">Tic Tac Toe</div>

    <div class="container-fluid px-0">
      <div class="row main-row g-0">
        <div class="col-12 col-md-2 aside-left">Aside 1</div>
        <main class="col-12 col-md-8 game-wrap">
          <div id="ttt-status">Player X's turn</div>
          <div id="ttt-board" class="ttt-board"></div>
          <button id="ttt-reset" class="btn btn-warning btn-lg" type="button">Reset Game</button>
        </main>
        <div class="col-12 col-md-2 aside-right">Aside 2</div>
      </div>
    </div>

    <div class="bar-footer">Footer</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        const boardEl = document.getElementById('ttt-board');
        const statusEl = document.getElementById('ttt-status');
        const resetBtn = document.getElementById('ttt-reset');

        const WIN_LINES = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8],
          [0, 3, 6], [1, 4, 7], [2, 5, 8],
          [0, 4, 8], [2, 4, 6]
        ];

        let cells, current, over;

        function render() {
          boardEl.innerHTML = '';
          cells.forEach((value, i) => {
            const cell = document.createElement('div');
            cell.className = 'ttt-cell' + (value ? ' taken' : '');
            cell.textContent = value || '';
            cell.addEventListener('click', () => handleMove(i));
            boardEl.appendChild(cell);
          });
        }

        function checkWinner() {
          for (const [a, b, c] of WIN_LINES) {
            if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a];
          }
          return cells.every((v) => v) ? 'draw' : null;
        }

        function handleMove(i) {
          if (over || cells[i]) return;
          cells[i] = current;
          const winner = checkWinner();
          if (winner === 'draw') {
            statusEl.textContent = "It's a draw!";
            over = true;
          } else if (winner) {
            statusEl.textContent = 'Player ' + winner + ' wins!';
            over = true;
          } else {
            current = current === 'X' ? 'O' : 'X';
            statusEl.textContent = "Player " + current + "'s turn";
          }
          render();
        }

        function resetGame() {
          cells = Array(9).fill(null);
          current = 'X';
          over = false;
          statusEl.textContent = "Player X's turn";
          render();
        }

        resetBtn.addEventListener('click', resetGame);
        resetGame();
      })();
    </script>
  </body>
</html>
